name: Daily Product Generator

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 7am UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily product pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily_products.py

      - name: Commit and push
        run: |
          git config user.name "DealsGlobe Bot"
          git config user.email "bot@dealsglobe.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily products $(date +'%Y-%m-%d'): 50 new review pages"
          git push

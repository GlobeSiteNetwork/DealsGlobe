name: Daily Product Generator

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate pages
        run: python daily_products.py
      - name: Commit and push
        run: |
          git config user.name "ShoppingOnline Bot"
          git config user.email "bot@shoppingonline.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily products $(date +'%Y-%m-%d'): 50 pages"
          git push
